<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatter</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="chat-app-header">
        <div class="logo">
          <img
            src="images/Chatterlogo.png"
            alt="Chatter"
            width="100px"
            height="100px"
          />
          
        </div>
        <div class="online-members">
          <h4 id="activeUsers">0 Kişi Aktif</h4>
        </div>
      </header>

      <main id="chat_container" class="chat-app-main">

      </main>

      <footer class="chat-app-footer">
        <div id="typing_indicator"></div>

        <input
          id="message_input"
          type="text"
          class="message-input"
          placeholder="Mesajınızı Yazın..."
        />
        <button onclick="sendMessage()" class="message-send-button">
          Gönder
        </button>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
